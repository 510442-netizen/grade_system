<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>總成績排行榜</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">🎓 學生成績系統</a>
        <div>
            <a class="btn btn-outline-light me-2" href="/input">成績填寫</a>
            <a class="btn btn-outline-light me-2 active" href="/rankings">統計排行榜</a>
            <a class="btn btn-outline-warning" href="/admin">管理後台</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="card shadow-sm p-4">
        <h3 class="mb-2">🏆 全校成績排行榜</h3>
        <p class="text-muted">（設為「不公開」者之成績仍會參與全校排名計算，但個人細節不會顯示於榜單上）</p>
        
        <table class="table table-hover mt-3">
            <thead class="table-dark">
                <tr>
                    <th style="width: 20%;">名次</th>
                    <th style="width: 25%;">學號</th>
                    <th style="width: 25%;">姓名</th>
                    <th style="width: 30%;">加權平均分數</th>
                </tr>
            </thead>
            <tbody id="rankingTable">
                <tr><td colspan="4" class="text-center">載入中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
async function fetchRankings() {
    const res = await fetch('/api/rankings');
    const publicList = await res.json();
    const tbody = document.getElementById('rankingTable');
    
    if (publicList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center">目前無可顯示的公開成績資料</td></tr>';
        return;
    }

    tbody.innerHTML = publicList.map(st => `
        <tr>
            <td><span class="badge ${st.rank === 1 ? 'bg-warning text-dark' : 'bg-secondary'} fs-6">第 ${st.rank} 名</span></td>
            <td>${st.student_id}</td>
            <td>${st.student_name}</td>
            <td><strong>${st.weighted_avg}</strong> 分</td>
        </tr>
    `).join('');
}

fetchRankings();
</script>
</body>
</html>

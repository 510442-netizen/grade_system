<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>管理者後台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">⚙️ 後端管理頁面</a>
        <div>
            <a class="btn btn-outline-light me-2" href="/input">成績填寫</a>
            <a class="btn btn-outline-light me-2" href="/rankings">統計排行榜</a>
        </div>
    </div>
</nav>

<div class="container mt-4" style="max-width: 900px;">
    <!-- 密碼輸入區 -->
    <div id="adminLogin" class="card p-4 shadow-sm">
        <h4 class="mb-3">管理者權限驗證</h4>
        <div class="input-group">
            <input type="password" id="adminPass" class="form-control" placeholder="請輸入管理者密碼">
            <button class="btn btn-primary" onclick="verifyAdmin()">登入後台</button>
        </div>
    </div>

    <!-- 管理者控制面板 -->
    <div id="adminPanel" class="d-none">
        <!-- JSON 備份恢復區塊 -->
        <div class="card p-4 shadow-sm mb-4 border-warning">
            <h4 class="text-warning-emphasis mb-2">🔄 資料恢復 (備份還原)</h4>
            <p class="text-muted fs-6">請將備份信件中的 JSON 內容完整複製並貼入下方文字方塊，點擊按鈕即可重置並還原資料庫。</p>
            <div class="mb-3">
                <textarea id="restoreJsonInput" class="form-control font-monospace" rows="6" placeholder="請在此貼上完整 JSON 文字..."></textarea>
            </div>
            <button class="btn btn-warning w-100" onclick="restoreData()">立即覆蓋還原資料庫</button>
        </div>

        <!-- 全校數據列表區塊 -->
        <div class="card p-4 shadow-sm">
            <h4 class="mb-3">📊 所有人成績原始明細</h4>
            <table class="table table-bordered table-striped">
                <thead class="table-secondary">
                    <tr>
                        <th>學號</th>
                        <th>姓名</th>
                        <th>公開模式</th>
                        <th>科目</th>
                        <th>分數</th>
                        <th>權重</th>
                    </tr>
                </thead>
                <tbody id="rawDataTable"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
let savedAdminPassword = '';

async function verifyAdmin() {
    savedAdminPassword = document.getElementById('adminPass').value;
    const res = await fetch('/api/admin/all_data', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ password: savedAdminPassword })
    });
    const data = await res.json();

    if (res.ok) {
        document.getElementById('adminLogin').classList.add('d-none');
        document.getElementById('adminPanel').classList.remove('d-none');
        renderTable(data.data);
    } else {
        alert(data.message);
    }
}

function renderTable(data) {
    const tbody = document.getElementById('rawDataTable');
    tbody.innerHTML = data.map(row => `
        <tr>
            <td>${row.student_id}</td>
            <td>${row.student_name}</td>
            <td>${row.is_public ? '<span class="text-success">公開</span>' : '<span class="text-danger">不公開</span>'}</td>
            <td>${row.subject_name || '-'}</td>
            <td>${row.score !== null ? row.score : '-'}</td>
            <td>${row.weight || '-'}</td>
        </tr>
    `).join('');
}

async function restoreData() {
    const restoreStr = document.getElementById('restoreJsonInput').value.trim();
    if (!restoreStr) {
        alert('請先貼上備份 JSON 資料！');
        return;
    }

    if (!confirm('警告：此操作將清除目前資料庫並全面恢復為貼上的備份資料，確定繼續嗎？')) {
        return;
    }

    const res = await fetch('/api/admin/restore', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            password: savedAdminPassword,
            restore_data: restoreStr
        })
    });
    const data = await res.json();
    alert(data.message);

    if (res.ok) {
        verifyAdmin();
        document.getElementById('restoreJsonInput').value = '';
    }
}
</script>
</body>
</html>
